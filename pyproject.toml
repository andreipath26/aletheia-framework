[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aletheia-framework"
version = "0.0.1"
description = "The advisor framework. Local-first, modular, governed personal AI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [
    { name = "andreipath26" },
]
keywords = [
    "ai",
    "personal-ai",
    "local-first",
    "privacy",
    "governance",
    "ipp",
    "acp",
    "rag",
    "memory",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
cloud = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/andreipath26/aletheia-framework"
Repository = "https://github.com/andreipath26/aletheia-framework"
Issues = "https://github.com/andreipath26/aletheia-framework/issues"

[project.scripts]
aletheia = "aletheia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aletheia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []
